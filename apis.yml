name: ScentBird
description: Scentbird is a New York City-based monthly fragrance subscription service, founded in 2014
  and backed by 500 Global and Y Combinator. Members receive a travel-size (8ml) designer fragrance
  each month for a flat subscription fee, selecting from a rotating catalog of hundreds of designer and
  niche perfume and cologne brands, and can also purchase full-size bottles, candles, and beauty products
  through the direct-to-consumer storefront. Scentbird operates as a consumer e-commerce and subscription
  brand; its public engineering presence is a GitHub organization of internal tooling and open-source
  forks (data-integration taps, shipping-API clients, Grails plugins), and it does not currently publish
  a public developer API, OpenAPI specification, or developer portal.
